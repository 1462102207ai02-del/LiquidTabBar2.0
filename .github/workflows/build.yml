name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          export THEOS=~/theos

      - name: Build
        run: |
          export THEOS=~/theos
          make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: Deb
          path: packages/*.deb
